<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 文件管理器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f2f5; --card: #fff; --border: #e0e3e8;
  --text: #1a1a2e; --text2: #555; --text3: #888;
  --primary: #4a90d9; --primary-hover: #3a7bc8;
  --danger: #e74c3c; --danger-hover: #c0392b;
  --success: #27ae60;
  --hover-bg: #f7f8fa; --selected-bg: #e8f0fe;
  --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.app { display: flex; flex-direction: column; height: 100vh; }

/* Top bar */
.topbar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: .5rem .75rem; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
}
.topbar-title { font-weight: 600; font-size: .95rem; white-space: nowrap; margin-right: .25rem; }
.topbar input {
  padding: .35rem .6rem; border: 1px solid var(--border); border-radius: 6px;
  font-size: .8rem; font-family: inherit; background: var(--card);
}
.topbar input:focus { outline: none; border-color: var(--primary); }
.topbar input[type="password"], .topbar input[type="text"].token-field { width: 190px; }
.topbar .sep { color: var(--border); font-size: .9rem; }

/* Combo */
.combo { position: relative; display: inline-flex; align-items: center; gap: 2px; }
.combo-input {
  width: 200px; padding: .35rem .6rem; border: 1px solid var(--border);
  border-radius: 6px; font-size: .8rem; font-family: inherit; background: var(--card);
}
.combo-input:focus { outline: none; border-color: var(--primary); }
.combo-list {
  position: absolute; top: 100%; left: 0; z-index: 50;
  width: max-content; min-width: 100%;
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  max-height: 280px; overflow-y: auto; display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.1); margin-top: 2px;
}
.combo.open .combo-list { display: block; }
.combo-item {
  padding: .4rem .75rem; font-size: .8rem; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.combo-item:hover { background: var(--hover-bg); }
.combo-item.active { background: var(--selected-bg); font-weight: 600; }
.combo-empty { padding: .5rem .75rem; font-size: .8rem; color: var(--text3); }

/* Case-sensitive toggle */
.cs-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 4px;
  font-size: .7rem; font-weight: 700; cursor: pointer; background: var(--card);
  color: var(--text3); user-select: none; transition: all .15s;
  font-family: var(--mono); line-height: 1;
}
.cs-toggle:hover { border-color: var(--primary); color: var(--primary); }
.cs-toggle.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Main area */
.main-area { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 300px; min-width: 200px; background: var(--card);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
}
.sidebar-header {
  padding: .5rem .75rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-header span { font-size: .85rem; font-weight: 600; }
.sidebar-actions { display: flex; gap: .25rem; }
.sidebar-search {
  padding: .4rem .75rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 4px;
}
.sidebar-search input {
  flex: 1; padding: .35rem .6rem; border: 1px solid var(--border);
  border-radius: 6px; font-size: .8rem; font-family: inherit;
}
.sidebar-search input:focus { outline: none; border-color: var(--primary); }
.tree-container { flex: 1; overflow-y: auto; padding: .25rem 0; }
.search-results { flex: 1; overflow-y: auto; padding: .25rem 0; }
.search-result-item {
  display: flex; align-items: center; padding: .35rem .75rem;
  cursor: pointer; font-size: .8rem; gap: .4rem;
}
.search-result-item:hover { background: var(--hover-bg); }
.search-result-item .icon { flex-shrink: 0; }
.search-result-item .sr-path {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--mono); font-size: .75rem;
}
.search-result-item .sr-name { font-weight: 600; }
.search-result-item .sr-dir { color: var(--text3); margin-left: .15rem; }

/* Tree */
.tree-item {
  display: flex; align-items: center; padding: .3rem .75rem;
  cursor: pointer; font-size: .85rem; user-select: none;
  border-left: 3px solid transparent;
}
.tree-item:hover { background: var(--hover-bg); }
.tree-item.selected { background: var(--selected-bg); border-left-color: var(--primary); }
.tree-item .icon { margin-right: .4rem; font-size: .9rem; flex-shrink: 0; }
.tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item .indent { display: inline-block; width: 1.2rem; flex-shrink: 0; }
.tree-item .change-badge {
  font-size: .65rem; padding: .1rem .35rem; border-radius: 3px;
  color: #fff; margin-left: .3rem; flex-shrink: 0;
}
.tree-item .change-badge.modified { background: #e67e22; }
.tree-item .change-badge.added { background: var(--success); }
.tree-item .change-badge.deleted { background: var(--danger); }
.tree-toggle { width: 1rem; text-align: center; flex-shrink: 0; font-size: .7rem; color: var(--text3); }

/* Content area */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.content-header {
  padding: .5rem 1rem; border-bottom: 1px solid var(--border);
  background: var(--card); display: flex; align-items: center; gap: .5rem;
  font-size: .85rem; min-height: 2.5rem;
}
.breadcrumb { display: flex; align-items: center; gap: .25rem; flex: 1; flex-wrap: wrap; }
.breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb span { color: var(--text3); }
.editor-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#editor {
  flex: 1; width: 100%; border: none; padding: 1rem;
  font-family: var(--mono); font-size: .85rem; line-height: 1.6;
  resize: none; outline: none; background: var(--card);
}
.editor-footer {
  padding: .5rem 1rem; border-top: 1px solid var(--border);
  background: var(--card); display: flex; align-items: center; gap: .5rem;
}
.placeholder-msg {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text3); font-size: .95rem; background: var(--card);
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="topbar-title">📂 GitHub 文件管理器</span>
    <input type="password" id="token-input" placeholder="Token (ghp_…)" class="token-field">
    <button class="btn btn-ghost btn-sm" onclick="toggleTokenVisibility()">👁</button>
    <span class="sep">|</span>
    <input type="text" id="user-input" placeholder="用户名" style="width:130px">
    <button class="btn btn-primary btn-sm" onclick="loadRepos()" id="load-repos-btn">加载账号</button>
    <div class="combo" id="repo-combo">
      <input type="text" class="combo-input" id="repo-input" placeholder="搜索或选择仓库…" autocomplete="off" style="width:180px">
      <span class="cs-toggle" id="repo-cs" onclick="toggleCs('repo')">Aa</span>
      <div class="combo-list" id="repo-list"></div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="loadBranches()" id="load-branches-btn">加载仓库</button>
    <span class="sep">|</span>
    <div class="combo" id="branch-combo">
      <input type="text" class="combo-input" id="branch-input" placeholder="搜索或选择分支…" autocomplete="off" style="width:150px">
      <span class="cs-toggle" id="branch-cs" onclick="toggleCs('branch')">Aa</span>
      <div class="combo-list" id="branch-list"></div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="loadTree()" id="load-tree-btn">加载分支</button>
  </div>
  <div class="mobile-tabs" id="mobile-tabs">
    <button class="active" onclick="switchMobileTab('files')">📁 文件</button>
    <button onclick="switchMobileTab('editor')">📝 编辑</button>
    <button onclick="switchMobileTab('changes')">📋 变更</button>
  </div>
  <div class="main-area">
    <!-- Sidebar: file tree -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span id="sidebar-title">文件</span>
        <div class="sidebar-actions">
          <button class="btn btn-ghost btn-sm" onclick="promptNewFile()" title="新建文件">📄+</button>
          <button class="btn btn-ghost btn-sm" onclick="promptNewFolder()" title="新建文件夹">📁+</button>
          <button class="btn btn-ghost btn-sm" onclick="triggerUpload()" title="上传文件">📤</button>
          <button class="btn btn-ghost btn-sm" onclick="loadTree()" title="刷新文件树">🔄</button>
          <input type="file" id="file-upload" multiple style="display:none" onchange="handleUpload(this)">
        </div>
      </div>
      <div class="sidebar-search">
        <input type="text" id="file-search" placeholder="🔍 搜索文件…" autocomplete="off">
        <span class="cs-toggle" id="file-cs" onclick="toggleCs('file')">Aa</span>
      </div>
      <div class="tree-container" id="tree"></div>
      <div class="search-results hidden" id="search-results"></div>
    </div>
    <!-- Content: editor -->
    <div class="content">
      <div class="content-header">
        <div class="breadcrumb" id="breadcrumb"></div>
      </div>
      <div id="editor-wrap" class="editor-wrap hidden">
        <textarea id="editor" spellcheck="false"></textarea>
        <div class="editor-footer">
          <button class="btn btn-primary" onclick="stageCurrentFile()" id="save-btn">💾 暂存修改</button>
          <button class="btn btn-ghost" onclick="revertCurrentFile()" id="revert-btn">↩ 撤销修改</button>
          <button class="btn btn-ghost" onclick="downloadCurrentFile()" id="download-btn">⬇️ 下载</button>
        </div>
      </div>
      <div id="placeholder" class="placeholder-msg">选择一个文件开始编辑</div>
    </div>
    <!-- Right panel: changes -->
    <div class="sidebar" id="changes-panel" style="width:280px;min-width:200px;border-left:1px solid var(--border);border-right:none;">
      <div class="sidebar-header">
        <span>📋 待提交变更 <span id="changes-count" style="color:var(--primary)"></span></span>
        <div class="sidebar-actions">
          <button class="btn btn-ghost btn-sm" onclick="discardAllChanges()" title="放弃所有变更">🗑️</button>
        </div>
      </div>
      <div class="tree-container" id="changes-list" style="flex:1;overflow-y:auto;padding:.25rem 0;"></div>
      <div style="padding:.5rem .75rem;border-top:1px solid var(--border);">
        <input type="text" id="commit-msg" placeholder="Commit message…" style="width:100%;padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;font-size:.8rem;margin-bottom:.5rem;">
        <textarea id="commit-desc" placeholder="Description (可选)…" style="width:100%;padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;font-size:.8rem;font-family:inherit;resize:vertical;min-height:50px;margin-bottom:.5rem;"></textarea>
        <button class="btn btn-primary" style="width:100%" onclick="commitAndPush()" id="commit-push-btn" disabled>🚀 Commit & Push</button>
      </div>
    </div>
  </div>
  <div class="statusbar">
    <span id="status-left">就绪</span>
    <span id="status-right"></span>
  </div>
</div>

<div class="ctx-menu hidden" id="ctx-menu"></div>
<div id="modal-container"></div>

<style>
/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .35rem .7rem; border: none; border-radius: 6px;
  font-size: .8rem; cursor: pointer; font-family: inherit;
  transition: background .15s, opacity .15s; white-space: nowrap;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-ghost:hover:not(:disabled) { background: var(--hover-bg); }
.btn-sm { padding: .25rem .5rem; font-size: .75rem; }
.statusbar {
  background: var(--card); border-top: 1px solid var(--border);
  padding: .3rem 1rem; font-size: .75rem; color: var(--text3);
  display: flex; justify-content: space-between;
}
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: var(--card); border-radius: 12px; padding: 1.5rem;
  min-width: 360px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,.15);
}
.modal h3 { font-size: 1rem; margin-bottom: 1rem; }
.modal label { display: block; font-size: .8rem; color: var(--text2); margin-bottom: .25rem; margin-top: .75rem; }
.modal input {
  width: 100%; padding: .45rem .6rem; border: 1px solid var(--border);
  border-radius: 6px; font-size: .85rem; font-family: inherit;
}
.modal input:focus { outline: none; border-color: var(--primary); }
.modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.25rem; }
.ctx-menu {
  position: fixed; background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  padding: .3rem 0; z-index: 200; min-width: 160px;
}
.ctx-menu-item {
  padding: .4rem 1rem; font-size: .8rem; cursor: pointer;
  display: flex; align-items: center; gap: .5rem;
}
.ctx-menu-item:hover { background: var(--hover-bg); }
.ctx-menu-sep { height: 1px; background: var(--border); margin: .25rem 0; }
.ctx-menu-item.danger { color: var(--danger); }
.change-item {
  display: flex; align-items: center; padding: .35rem .75rem;
  font-size: .8rem; gap: .4rem; cursor: default;
}
.change-item .ch-type {
  font-size: .65rem; padding: .1rem .35rem; border-radius: 3px;
  color: #fff; flex-shrink: 0;
}
.change-item .ch-type.M { background: #e67e22; }
.change-item .ch-type.A { background: var(--success); }
.change-item .ch-type.D { background: var(--danger); }
.change-item .ch-type.R { background: #8e44ad; }
.change-item .ch-path {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--mono); font-size: .75rem;
}
.change-item .ch-undo {
  cursor: pointer; font-size: .75rem; color: var(--text3);
  padding: .1rem .3rem; border-radius: 3px;
}
.change-item .ch-undo:hover { background: var(--hover-bg); color: var(--danger); }
.hidden { display: none; }

/* Mobile tab bar */
.mobile-tabs {
  display: none; background: var(--card); border-bottom: 1px solid var(--border);
  padding: 0; overflow-x: auto;
}
.mobile-tabs button {
  flex: 1; padding: .5rem; border: none; background: none; font-size: .75rem;
  cursor: pointer; color: var(--text3); border-bottom: 2px solid transparent;
  white-space: nowrap; font-family: inherit;
}
.mobile-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* Mobile responsive */
@media (max-width: 768px) {
  .topbar {
    padding: .4rem .5rem; gap: .35rem;
  }
  .topbar-title { font-size: .85rem; width: 100%; margin-bottom: .2rem; }
  .topbar .sep { display: none; }
  .topbar input[type="password"], .topbar input[type="text"].token-field { width: 140px; }
  .topbar input[type="text"]#user-input { width: 90px; }
  .combo-input#repo-input, .combo-input#branch-input { width: 120px !important; }
  .combo-list { width: calc(100vw - 2rem); left: auto; right: 0; }
  .btn-sm { padding: .2rem .4rem; font-size: .7rem; }

  .mobile-tabs { display: flex; }

  .main-area { flex-direction: column; position: relative; }
  .main-area > .sidebar,
  .main-area > .content,
  .main-area > #changes-panel {
    position: absolute; inset: 0;
    width: 100% !important; min-width: 0 !important;
    border: none !important;
    display: none;
  }
  .main-area > .mobile-visible { display: flex; }

  .editor-footer { flex-wrap: wrap; gap: .35rem; padding: .4rem .5rem; }
  .editor-footer .btn { font-size: .7rem; padding: .3rem .5rem; }

  .modal { min-width: auto; width: calc(100vw - 2rem); }
  .statusbar { font-size: .65rem; padding: .25rem .5rem; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
